version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
    pull-request-branch-name:
      separator: "-"
    ignore:
      # 0.8.0 is browser-only; rehype-mermaid requires the alpha's build-time SDK.
      - dependency-name: "@mermanjs/web"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
