<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" role="img" aria-labelledby="title" font-family="system-ui, Segoe UI, Microsoft YaHei, sans-serif"><title id="title">二阶张量的矩阵表示</title><rect width="800" height="425" rx="16" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="32" y="45" font-size="23" fill="#243447" >二阶张量：选定基底后，用一个矩阵排列九个分量</text><text x="150" y="95" font-size="18" fill="#50788c" >列 j = 1、2、3：输入的基方向</text><path d="M167 120H157V360H167 M413 120H423V360H413" fill="none" stroke="#54717f" stroke-width="2"/><rect x="173" y="123" width="74" height="74" rx="5" fill="#e0f2f1"/><text x="210.0" y="169.1" font-size="26" fill="#243447" text-anchor="middle">A₁₁</text><rect x="253" y="123" width="74" height="74" rx="5" fill="#e5edf9"/><text x="290.0" y="169.1" font-size="26" fill="#243447" text-anchor="middle">A₁₂</text><rect x="333" y="123" width="74" height="74" rx="5" fill="#f8ecd9"/><text x="370.0" y="169.1" font-size="26" fill="#243447" text-anchor="middle">A₁₃</text><rect x="173" y="203" width="74" height="74" rx="5" fill="#e0f2f1"/><text x="210.0" y="249.1" font-size="26" fill="#243447" text-anchor="middle">A₂₁</text><rect x="253" y="203" width="74" height="74" rx="5" fill="#e5edf9"/><text x="290.0" y="249.1" font-size="26" fill="#243447" text-anchor="middle">A₂₂</text><rect x="333" y="203" width="74" height="74" rx="5" fill="#f8ecd9"/><text x="370.0" y="249.1" font-size="26" fill="#243447" text-anchor="middle">A₂₃</text><rect x="173" y="283" width="74" height="74" rx="5" fill="#e0f2f1"/><text x="210.0" y="329.1" font-size="26" fill="#243447" text-anchor="middle">A₃₁</text><rect x="253" y="283" width="74" height="74" rx="5" fill="#e5edf9"/><text x="290.0" y="329.1" font-size="26" fill="#243447" text-anchor="middle">A₃₂</text><rect x="333" y="283" width="74" height="74" rx="5" fill="#f8ecd9"/><text x="370.0" y="329.1" font-size="26" fill="#243447" text-anchor="middle">A₃₃</text><text x="30" y="160" font-size="18" fill="#243447" >行 i = 1</text><text x="30" y="240" font-size="18" fill="#243447" >行 i = 2</text><text x="30" y="320" font-size="18" fill="#243447" >行 i = 3</text><text x="485" y="200" font-size="28" fill="#243447" >w = Av</text><text x="485" y="245" font-size="22" fill="#243447" >wᵢ = Σⱼ Aᵢⱼvⱼ</text><text x="32" y="390" font-size="17" fill="#243447" >第 j 列就是 A 作用于第 j 个基向量的结果；分量排列不等于坐标无关的对象。</text></svg>
