<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 505" role="img" aria-labelledby="title" font-family="system-ui, Segoe UI, Microsoft YaHei, sans-serif"><title id="title">柯西四面体斜面面积与坐标投影面积</title><rect width="780" height="505" rx="16" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="30" y="45" font-size="23" fill="#243447" >柯西四面体：斜面的投影面积给出牵引力的线性关系</text><polygon points="90,230 220,90 440,310" fill="#e0f2f1" stroke="#318b9e" stroke-width="2"/><path d="M190 350L90 230 M190 350L220 90 M190 350L440 310" stroke="#8297a7" stroke-dasharray="6 5" fill="none"/><path d="M250 230L360 135" stroke="#d88a30" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="130" font-size="25" fill="#bd7624" >n</text><text x="250" y="280" font-size="19" fill="#243447" >斜面面积 A</text><text x="170" y="380" font-size="22" fill="#243447" >O</text><text x="490" y="150" font-size="25" fill="#243447" >Aₓ = nₓA</text><text x="490" y="200" font-size="25" fill="#243447" >Aᵧ = nᵧA</text><text x="490" y="250" font-size="25" fill="#243447" >A_z = n_zA</text><text x="30" y="420" font-size="20" fill="#243447" >表面积项 O(h²)，体积项 O(h³)；除以斜面面积后，令 h → 0。</text><text x="30" y="465" font-size="23" fill="#318b9e" >t(n) = nₓ t(eₓ) + nᵧ t(eᵧ) + n_z t(e_z) = σn</text></svg>
