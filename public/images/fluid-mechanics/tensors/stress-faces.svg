<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 485" role="img" aria-labelledby="title" font-family="system-ui, Segoe UI, Microsoft YaHei, sans-serif"><title id="title">微小立方体的正向面与应力矩阵三列</title><rect width="780" height="485" rx="16" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="30" y="45" font-size="23" fill="#243447" >应力矩阵的三列，分别记录三个正向坐标面的牵引力</text><polygon points="90,170 240,170 240,320 90,320" fill="#e0f2f1" stroke="#54717f"/><polygon points="90,170 155,105 305,105 240,170" fill="#e5edf9" stroke="#54717f"/><polygon points="240,170 305,105 305,255 240,320" fill="#f8ecd9" stroke="#54717f"/><path d="M270 210H360 M165 145L200 80 M170 245L70 270" fill="none" stroke="#318b9e" stroke-width="3" marker-end="url(#arrow)"/><text x="317" y="196" font-size="18" fill="#243447" >n = eₓ</text><text x="205" y="83" font-size="18" fill="#243447" >n = eᵧ</text><text x="30" y="295" font-size="18" fill="#243447" >n = e_z</text><path d="M457 115H447V361H457 M709 115H719V361H709" fill="none" stroke="#54717f" stroke-width="2"/><rect x="463" y="118" width="76" height="76" rx="5" fill="#e0f2f1"/><text x="501.0" y="164.05" font-size="23" fill="#243447" text-anchor="middle">σxx</text><rect x="545" y="118" width="76" height="76" rx="5" fill="#e5edf9"/><text x="583.0" y="164.05" font-size="23" fill="#243447" text-anchor="middle">σxy</text><rect x="627" y="118" width="76" height="76" rx="5" fill="#f8ecd9"/><text x="665.0" y="164.05" font-size="23" fill="#243447" text-anchor="middle">σxz</text><rect x="463" y="200" width="76" height="76" rx="5" fill="#e0f2f1"/><text x="501.0" y="246.05" font-size="23" fill="#243447" text-anchor="middle">σyx</text><rect x="545" y="200" width="76" height="76" rx="5" fill="#e5edf9"/><text x="583.0" y="246.05" font-size="23" fill="#243447" text-anchor="middle">σyy</text><rect x="627" y="200" width="76" height="76" rx="5" fill="#f8ecd9"/><text x="665.0" y="246.05" font-size="23" fill="#243447" text-anchor="middle">σyz</text><rect x="463" y="282" width="76" height="76" rx="5" fill="#e0f2f1"/><text x="501.0" y="328.05" font-size="23" fill="#243447" text-anchor="middle">σzx</text><rect x="545" y="282" width="76" height="76" rx="5" fill="#e5edf9"/><text x="583.0" y="328.05" font-size="23" fill="#243447" text-anchor="middle">σzy</text><rect x="627" y="282" width="76" height="76" rx="5" fill="#f8ecd9"/><text x="665.0" y="328.05" font-size="23" fill="#243447" text-anchor="middle">σzz</text><text x="460" y="400" font-size="21" fill="#318b9e" >t(eₓ)     t(eᵧ)     t(e_z)</text><text x="30" y="445" font-size="20" fill="#243447" >列：面的法向方向 j；行：牵引力的分量方向 i。负向面受力方向相反。</text></svg>
